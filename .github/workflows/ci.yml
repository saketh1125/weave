name: CI

on:
  push:
    branches: [main, "codex/**"]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: sentra
          POSTGRES_USER: sentra
          POSTGRES_PASSWORD: sentra
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sentra -d sentra"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql+asyncpg://sentra:sentra@localhost:5432/sentra
      SENTRA_TEST_DATABASE_URL: postgresql+psycopg://sentra:sentra@localhost:5432/sentra
      SENTRA_ACCESS_TOKEN: ci-only-test-token-that-is-not-a-secret
      SENTRA_CORS_ORIGINS: http://localhost:5174
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install backend and test dependencies
        run: |
          python -m pip install -r requirements.lock
          python -m pip install -e ".[test]"
      - name: Run backend tests and PostgreSQL integration tests
        run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Check documentation response contracts
        run: node --test test/docs-response.test.ts test/documentation-review.test.ts test/documentation-draft.test.ts
      - name: Build frontend
        run: npm run build
